<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>신고하기</title>
    <script src="../javascript/reportpage.js"></script>
    <link rel="stylesheet" href="../css/reportpage.css" />
  </head>
  <body>
    <div class="header"><span class="header-icon">🚨</span> 신고하기</div>

    <div class="container">
      <div class="row">
        <div class="label">제 목</div>
        <div class="value"></div>
      </div>

      <div class="row">
        <div class="label">작성자 닉네임</div>
        <div class="value"></div>
      </div>

      <div class="row">
        <div class="label">신고자 닉네임</div>
        <div class="value"></div>
      </div>

      <div class="row">
        <div class="label">신고사유</div>
        <div class="value radio-group">
          <label>
            <input type="radio" name="reason" value="abuse" checked />
            욕설/비방
          </label>
          <label><input type="radio" name="reason" value="spam" /> 도배</label>
          <label>
            <input type="radio" name="reason" value="ad" /> 홍보/상업성
          </label>
          <label><input type="radio" name="reason" value="19" /> 음란성</label>
          <label><input type="radio" name="reason" value="etc" /> 기타</label>
        </div>
      </div>

      <textarea
        class="textarea-box"
        placeholder="신고 사유를 상세히 입력해주세요."
      ></textarea>

      <div class="info-box">
        신고 게시물은 삭제되며, 해당 게시물을 올린 유저는 덧글쓰기 및 글쓰기
        제한을 받을 수 있습니다.<br />
        단, 허위신고일 경우, 신고자의 활동에 제한을 받게 되오니, 그 점 유의해
        주시기 바랍니다.
      </div>
    </div>

    <div class="footer-buttons">
      <button class="btn btn-submit">🚨 신고하기</button>

      <button class="btn btn-close">닫 기</button>
    </div>
  </body>
</html>

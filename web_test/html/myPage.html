<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>내면의 흔적 - 마이페이지</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="../javascript/common.js"></script>
    <script src="../javascript/mypage.js"></script>
    <script src="../javascript/mypage_diary_list.js"></script>

    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/mypage.css" />
    <link rel="stylesheet" href="../css/mypage_diary_list.css" />
  </head>
  <body>
    <header>
      <div class="container header-inner flex-between">
        <a
          href="../html/main.html"
          class="logo-area"
          style="text-decoration: none"
        >
          <h1 class="logo-text">내면의 흔적</h1>
        </a>
        <div class="auth-links">
          <a href="../html/login_page.html" class="auth-item">로그인</a>
          <span class="divider">|</span>
          <a href="../html/sign_in.html" class="auth-item">회원가입</a>
        </div>
      </div>
    </header>

    <main class="container">
      <div class="tab-list">
        <div class="menu-label">메뉴</div>
        <a href="../html/overview.html" class="tab-btn">
          <i data-lucide="sparkles"></i> 개요
        </a>
        <a href="../html/notice.html" class="tab-btn">
          <i data-lucide="book-open"></i> 공지사항
        </a>
        <div class="dropdown-container">
          <a
            href="../html/board_diary.html"
            class="tab-btn"
            style="width: 100%; border: none"
          >
            <i data-lucide="pencil"></i> 게시판
          </a>
          <div class="dropdown-content">
            <a href="../html/board_diary.html">📖 일기 공개 게시판</a>
            <a href="../html/board_quotes.html">💬 명언 모음집</a>
          </div>
        </div>
        <a href="../html/mypage.html" class="tab-btn active">
          <i data-lucide="user"></i> 마이페이지
        </a>
      </div>

      <div class="tab-content mypage-content">
        <div class="wf-container">
          <section class="wf-card wf-profile-header">
            <div class="wf-user-info-group">
              <div class="wf-profile-img"></div>
              <div class="wf-user-info">
                <h2>
                  기록하는사람
                  <span class="user-badge"
                    ><i data-lucide="award" size="14"></i> Lv. 3</span
                  >
                </h2>
                <p>
                  <i
                    data-lucide="quote"
                    size="12"
                    style="margin-right: 5px; color: #999"
                  ></i
                  >오늘도 나를 돌아보는 시간, 참 소중해요.
                </p>
              </div>
            </div>
            <div class="wf-stats-group">
              <div class="wf-stat-card">
                <i data-lucide="book" size="20" color="#4a90e2"></i>
                <span class="wf-stat-label">총 일기 수</span>
                <span class="wf-stat-value">123</span>
              </div>
              <div class="wf-stat-card">
                <i data-lucide="calendar-check" size="20" color="#2ecc71"></i>
                <span class="wf-stat-label">이번 달 작성</span>
                <span class="wf-stat-value">12</span>
              </div>
            </div>
          </section>

          <section>
            <div class="wf-tab-menu">
              <button
                class="wf-tab-btn active"
                onclick="switchCustomTab('my-diary', event)"
              >
                <i data-lucide="book-open-text" size="18"></i> 내 일기
              </button>
              <button
                class="wf-tab-btn"
                onclick="switchCustomTab('my-info', event)"
              >
                <i data-lucide="user-cog" size="18"></i> 내 정보 관리
              </button>
            </div>

            <div class="wf-card wf-content-box">
              <div id="my-diary" class="wf-tab-content active">
                <div class="content-header">
                  <div class="content-title">
                    <i data-lucide="history" color="#4a90e2"></i> 최근 작성한
                    일기 히스토리
                  </div>
                 
                </div>

                <div class="diary-container">
                  <div class="diary-top-card">
                    <div class="calendar">
                      <h3>2025년 11월</h3>
                      <div class="calendar-grid" id="calendar"></div>
                    </div>

                    <div class="diary-list">
                      <h3 id="selectedDate">날짜를 선택하세요</h3>
                      <ul id="diaryTypeList"></ul>
                    </div>
                  </div>

                  <div class="diary-content-card">
                    <p id="diaryContent">일기를 선택하면 내용이 표시됩니다.</p>
                  </div>
                </div>
              </div>

              <div id="my-info" class="wf-tab-content">
                <div class="content-header">
                  <div class="content-title">
                    <i data-lucide="settings" color="#4a90e2"></i> 계정 및 정보
                    설정
                  </div>
                </div>
                

                  
                </div>
              </div>
            </div>
          </section>
        </div>
      </div>
    </main>
    <footer>
      <div class="container">
        <p>© 2024 내면의 흔적. All rights reserved.</p>
      </div>
    </footer>
  </body>
</html>
